name: aidevops-assets-production
services:
  api:
    image: aidevops-assets-api:1.0.0
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: &production-env
      DB_URL: ${DB_URL:?Configure approved PostgreSQL JDBC URL}
      DB_USER: ${DB_USER:?Configure database user}
      DB_PASSWORD: ${DB_PASSWORD:?Configure database credential}
      OIDC_ISSUER: ${OIDC_ISSUER:?Configure approved identity issuer}
      OIDC_JWKS: ${OIDC_JWKS:?Configure approved identity JWKS}
      CORS_ORIGINS: ${PUBLIC_URL:?Configure public application URL}
      DEMO_ENABLED: "false"
      ASSETS_ROLE: api
      SPRINGDOC_API_DOCS_ENABLED: "false"
    restart: unless-stopped
  worker:
    image: aidevops-assets-api:1.0.0
    environment:
      <<: *production-env
      ASSETS_ROLE: worker
      PORT: 8083
    depends_on: [api]
    restart: unless-stopped
  gateway:
    image: aidevops-assets-gateway:1.0.0
    build: {context: ., dockerfile: gateway/Dockerfile}
    environment: {BACKEND_URL: "http://api:8081"}
    depends_on: [api]
    restart: unless-stopped
  web:
    image: aidevops-assets-web:1.0.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:?Configure approved identity issuer}
    ports: ["127.0.0.1:${WEB_PORT:-19380}:80"]
    depends_on: [gateway]
    restart: unless-stopped
