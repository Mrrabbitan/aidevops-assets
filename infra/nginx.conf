server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 absolute_redirect off;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location /api/ { proxy_pass http://gateway:8082; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_connect_timeout 10s; proxy_read_timeout 60s; }
 location /mcp { proxy_pass http://gateway:8082; proxy_buffering off; proxy_read_timeout 300s; }
 location = /assets { rewrite ^ /index.html last; }
 location = /assets/ { rewrite ^ /index.html last; }
 location / { try_files $uri /index.html; }
}
